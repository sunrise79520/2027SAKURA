<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e86f91" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="花開海峽" />
  <title>2027 花開海峽，搭船去追春｜旅行手冊</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell" id="top">
    <header class="hero card" aria-label="旅遊手冊封面">
      <div class="hero__badge"><span class="icon" data-icon="sakura"></span> 2027 春旅</div>
      <h1>花開海峽，搭船去追春</h1>
      <p>釜山・大邱・鎮海・慶州・福岡 12 日完全說明書</p>
      <div class="hero__meta">
        <span><span class="icon" data-icon="calendar"></span> 2027/03/19 – 03/30</span>
        <span><span class="icon" data-icon="users"></span> 3人：我、姊姊、姊夫</span>
      </div>
    </header>

    <main>
      <section class="section" id="tools" aria-labelledby="tools-title">
        <div class="section-title-row">
          <div>
            <p class="eyebrow">TOOLS</p>
            <h2 id="tools-title">旅行工具箱</h2>
          </div>
          <button type="button" class="pill-button small" id="collapseToolsBtn">
            <span class="icon" data-icon="minimize"></span> 收合
          </button>
        </div>

        <div class="tool-grid" role="list">
          <button type="button" class="tool-card active" data-tool="overview" role="listitem">
            <span class="tool-card__icon"><span class="icon" data-icon="route"></span></span>
            <span>總覽</span>
          </button>
          <button type="button" class="tool-card" data-tool="budget" role="listitem">
            <span class="tool-card__icon"><span class="icon" data-icon="calculator"></span></span>
            <span>預算</span>
          </button>
          <button type="button" class="tool-card" data-tool="tickets" role="listitem">
            <span class="tool-card__icon"><span class="icon" data-icon="ticket"></span></span>
            <span>票券</span>
          </button>
          <button type="button" class="tool-card" data-tool="transport" role="listitem">
            <span class="tool-card__icon"><span class="icon" data-icon="train"></span></span>
            <span>交通</span>
          </button>
          <button type="button" class="tool-card" data-tool="packing" role="listitem">
            <span class="tool-card__icon"><span class="icon" data-icon="suitcase"></span></span>
            <span>行李</span>
          </button>
          <button type="button" class="tool-card" data-tool="rules" role="listitem">
            <span class="tool-card__icon"><span class="icon" data-icon="passport"></span></span>
            <span>規定</span>
          </button>
        </div>

        <article class="tool-panel card" id="toolPanel" aria-live="polite"></article>
      </section>

      <section class="section" id="daily" aria-labelledby="daily-title">
        <div class="section-title-row">
          <div>
            <p class="eyebrow">DAILY PLAN</p>
            <h2 id="daily-title">每日行程</h2>
          </div>
          <button type="button" class="pill-button small" id="todayBtn">
            <span class="icon" data-icon="pin"></span> 回到 D1
          </button>
        </div>

        <div class="day-strip" id="dayStrip" aria-label="選擇每日行程"></div>
        <article class="day-card card" id="dayCard" aria-live="polite"></article>
      </section>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="主要導覽">
    <a href="#top" class="bottom-nav__item active"><span class="icon" data-icon="home"></span><span>總覽</span></a>
    <a href="#tools" class="bottom-nav__item"><span class="icon" data-icon="grid"></span><span>工具</span></a>
    <a href="#daily" class="bottom-nav__item"><span class="icon" data-icon="calendar-days"></span><span>行程</span></a>
    <a href="#tool-budget" class="bottom-nav__item" data-jump-tool="budget"><span class="icon" data-icon="yen"></span><span>預算</span></a>
    <a href="#tool-rules" class="bottom-nav__item" data-jump-tool="rules"><span class="icon" data-icon="alert"></span><span>注意</span></a>
  </nav>

  <button class="back-to-top" id="backToTop" type="button" aria-label="回到頂端"><span class="icon" data-icon="arrow-up"></span></button>

  <script src="app.js"></script>
</body>
</html>
